<!--
  [INPUT]: 依赖 tokens/button/styles/window-controls/about/toast视觉层、同源应用标识、冻结bridge、先于UI_TEXT加载的user-profile-text字典、共享图标/Toast状态机、project-link-control与About页面控制器。
  [OUTPUT]: 提供复用主窗口40px可拖动Chrome的独立About页面；Twitter/X与小红书按「四语关注文字+图标」显示，aria名称区分平台；GitHub项目与许可证保持全宽；外链失败只显示局部Toast。
  [POS]: renderer 的独立信息窗口页面，与主 index.html 的业务状态和 dialog 生命周期隔离；macOS 复用 Overlay 与原生交通灯，Windows 复用无系统装饰的标题栏、caption Button 和 compositor alpha 外壳。
  [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
-->
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Cavalry Language Switcher</title>
  <link rel="stylesheet" href="./tokens.css" />
  <link rel="stylesheet" href="./button.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./window-controls.css" />
  <link rel="stylesheet" href="./about.css" />
  <link rel="stylesheet" href="./toast.css" />
</head>

<body>
  <div class="window-surface about-surface">
    <header class="titlebar about-titlebar" data-tauri-drag-region>
      <div class="native-controls-space" aria-hidden="true" data-tauri-drag-region></div>
      <div class="titlebar-copy" data-tauri-drag-region>
        <span class="window-title" data-tauri-drag-region aria-hidden="true"></span>
      </div>
      <div id="aboutWindowControls" class="windows-window-controls" hidden>
        <button id="aboutWindowCloseButton" type="button" class="ui-button window-control-button window-control-close" data-slot="button" data-variant="ghost" data-size="icon-sm" aria-label="Close" title="Close"></button>
      </div>
    </header>
    <main class="about-window" aria-labelledby="aboutTitle" aria-describedby="aboutVersion">
      <img class="about-app-icon" src="./app-icon.png" alt="" aria-hidden="true" />
      <h1 id="aboutTitle" class="about-title">Cavalry Language Switcher</h1>
      <p id="aboutVersion" class="about-version" aria-live="polite"></p>
      <nav id="aboutLinks" class="about-links" aria-label="Project links">
        <div class="about-social-links">
          <a id="aboutTwitterLink" class="about-link" href="#twitter" aria-label="Follow on X (Twitter)">
            <span id="aboutTwitterLabel">Follow</span>
            <span id="aboutTwitterIcon" class="about-link-icon" aria-hidden="true"></span>
          </a>
          <a id="aboutXiaohongshuLink" class="about-link" href="#xiaohongshu" aria-label="Follow on Xiaohongshu">
            <span id="aboutXiaohongshuLabel">Follow</span>
            <span id="aboutXiaohongshuIcon" class="about-link-icon about-link-icon-xiaohongshu" aria-hidden="true"></span>
          </a>
        </div>
        <a id="aboutRepositoryLink" class="about-link" href="#repository">
          <span id="aboutRepositoryIcon" class="about-link-icon" aria-hidden="true"></span>
          <span id="aboutRepositoryLabel">Cavalry-i18n</span>
        </a>
        <a id="aboutLicenseLink" class="about-link" href="#license"><span id="aboutLicenseLabel">MIT License</span></a>
      </nav>
    </main>
  </div>

  <script src="./tauri-bridge.js"></script>
  <script src="./user-profile-text.js"></script>
  <script src="./ui-text.js"></script>
  <script src="./icons.js"></script>
  <script src="./toast-control.js"></script>
  <script src="./project-link-control.js"></script>
  <script src="./about-window.js"></script>
</body>

</html>
